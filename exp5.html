<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <hr>
    <fieldset>
        <label for="name">Full Name:</label>
        <input type="text" name="name" id="email" placeholder="Enter your full name" max="15" min="2">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter valid email address">
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" placeholder="Enter password">
        <br><br>
        <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Other</label>
        <br><br>  
        <label for="lang">Course:</label>
            <select name="lang" id="lang">
                <option value="select">select course</option>
                <option value="c">c</option>
                <option value="c++">c++</option>
                <option value="java">java</option>
                <option value="python">python</option>
            </select>  
        <br><br>
        <label for="tel">Contact No:</label>
        <input type="tel" name="tel" id="tel" placeholder="Enter phone number">
        <br><br>
        <label for="add">Address:</label><br>
            <textarea name="add" id="add">Enter your address</textarea>
        <br><br>
        <input type="submit"value="Register">
        <input type="reset" value="Clear">
        <hr>
                <p align="center">&copy 2025 student Registration Portal</p>









    </fieldset>

    
</body>
</html>
